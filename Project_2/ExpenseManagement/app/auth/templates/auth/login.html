{% extends "base_auth.html" %}
{% block title %}Entrar — FinControl{% endblock %}
 
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
 
    <div class="flex flex-col items-center mb-10">
      <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-surface border border-surface-border mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L3 7v10l9 5 9-5V7L12 2z"
                stroke="#7F77DD" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M12 22V12M3 7l9 5 9-5"
                stroke="#7F77DD" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="text-xl font-medium text-gray-100 tracking-tight">FinControl</h1>
      <p class="text-sm text-gray-500 mt-1"> Acesse sua conta </p>
    </div>
 
    <!-- Erro inline -->
    <div id="auth-error"
         class="hidden mb-4 px-4 py-3 rounded-lg text-sm
                bg-red-950 border border-red-800 text-red-300 text-center">
    </div>
 
    <!-- Botões de login -->
    <div class="flex flex-col gap-3">
 
      <!-- Google -->
      <button
        id="btn-google"
        data-label="Continuar com Google"
        onclick="loginGoogle()"
        class="flex items-center gap-3 w-full px-4 py-3
               bg-surface border border-surface-border rounded-lg
               text-sm text-gray-200 font-normal
               hover:bg-surface-hover hover:border-gray-600
               transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <!-- Logo Google -->
        <svg width="18" height="18" viewBox="0 0 24 24" class="shrink-0">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span data-label>Continuar com Google</span>
      </button>
 
      <!-- Microsoft -->
      <button
        id="btn-microsoft"
        data-label="Continuar com Microsoft"
        onclick="loginMicrosoft()"
        class="flex items-center gap-3 w-full px-4 py-3
               bg-surface border border-surface-border rounded-lg
               text-sm text-gray-200 font-normal
               hover:bg-surface-hover hover:border-gray-600
               transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <!-- Logo Microsoft -->
        <svg width="18" height="18" viewBox="0 0 24 24" class="shrink-0">
          <path d="M11.4 24H0V12.6L11.4 24z"   fill="#F25022"/>
          <path d="M24 24H12.6L24 12.6V24z"     fill="#00A4EF"/>
          <path d="M11.4 0H0v11.4L11.4 0z"      fill="#7FBA00"/>
          <path d="M24 0H12.6L24 11.4V0z"       fill="#FFB900"/>
        </svg>
        <span data-label>Continuar com Microsoft</span>
      </button>
 
    </div>
 
    <!-- Rodapé -->
    <p class="mt-8 text-center text-xs text-gray-600 leading-relaxed">
      Ao continuar, você concorda com os
      <a href="#" class="text-brand hover:text-brand-dark transition-colors">Termos de Uso</a>
      e
      <a href="#" class="text-brand hover:text-brand-dark transition-colors">Política de Privacidade</a>
    </p>
 
  </div>
</div>
{% endblock %}
